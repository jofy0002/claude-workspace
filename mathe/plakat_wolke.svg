<svg xmlns="http://www.w3.org/2000/svg" xmlns:gn="http://www.goodnotes.com/gn-svg" width="1600" height="1165" viewBox="0 0 1600 1165"><circle cx="95" cy="68" r="28" fill="#6CD4E4" stroke="none" stroke-width="0"/><circle cx="129" cy="50" r="36" fill="#6CD4E4" stroke="none" stroke-width="0"/><circle cx="167" cy="64" r="30" fill="#6CD4E4" stroke="none" stroke-width="0"/><circle cx="193" cy="76" r="20" fill="#6CD4E4" stroke="none" stroke-width="0"/><rect x="75" y="68" width="130" height="28" rx="14" fill="#6CD4E4"/><polygon points="1500.0,38.0 1510.6,65.4 1539.9,67.0 1517.1,85.6 1524.7,114.0 1500.0,98.0 1475.3,114.0 1482.9,85.6 1460.1,67.0 1489.4,65.4" fill="#F6DD6B" stroke="#333333" stroke-width="3"/><text x="800" y="72" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">Funktionsgleichungen aufstellen – so geht's!</text><text x="800" y="112" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#555555" text-anchor="middle" xml:space="preserve">Strategie-Plakat von Team „Wolke“ für die Gruppe „Stern“</text><rect x="40" y="145" width="740" height="95" rx="14" fill="#FFF6E5" stroke="#333333" stroke-width="2.5"/><text x="60" y="185" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Grundform einer Geraden:   y = m · x + b</text><text x="60" y="222" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">m = Steigung      b = y-Achsenabschnitt  →  Schnitt mit der y-Achse in (0 | b)</text><rect x="40" y="260" width="740" height="165" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><circle cx="78" cy="298" r="22" fill="#6CD4E4" stroke="#333333" stroke-width="2.5"/><text x="78" y="307" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">1</text><text x="115" y="308" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Steigung m bestimmen</text><text x="62" y="346" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• parallel zu g:  gleiche Steigung   m₂ = m₁</text><text x="62" y="376" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• senkrecht (rechtwinklig) zu g:   m₂ = −1 : m₁</text><text x="62" y="406" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">   Probe: m₁ · m₂ = −1      z. B.  2 · (−½) = −1  ✓</text><rect x="40" y="440" width="740" height="160" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><circle cx="78" cy="478" r="22" fill="#6CD4E4" stroke="#333333" stroke-width="2.5"/><text x="78" y="487" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">2</text><text x="115" y="488" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Einen Punkt P der neuen Geraden finden</text><text x="62" y="526" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• Ordinatendurchgang (y-Achse): x = 0 einsetzen → P(0 | b)</text><text x="62" y="556" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• Nullstelle: y = 0 setzen, nach x auflösen → P(x₀ | 0)</text><text x="62" y="586" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• Schnittpunkt: beide Funktionsterme gleichsetzen</text><rect x="40" y="615" width="740" height="130" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><circle cx="78" cy="653" r="22" fill="#6CD4E4" stroke="#333333" stroke-width="2.5"/><text x="78" y="662" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">3</text><text x="115" y="663" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">b berechnen</text><text x="62" y="701" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">P in y = m · x + b einsetzen und nach b auflösen</text><text x="62" y="731" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">z. B. P(2 | 0), m = −½:   0 = −½ · 2 + b  →  b = 1</text><rect x="40" y="760" width="740" height="130" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><circle cx="78" cy="798" r="22" fill="#6CD4E4" stroke="#333333" stroke-width="2.5"/><text x="78" y="807" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">4</text><text x="115" y="808" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Gleichung aufschreiben + Probe</text><text x="62" y="846" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">x nicht vergessen!   g(x) = −½x + 1   statt   (−½) + 1</text><text x="62" y="876" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Probe: Punkt einsetzen – kommt der richtige y-Wert raus?</text><rect x="820" y="145" width="740" height="205" rx="14" fill="#F7DDE8" stroke="#333333" stroke-width="2.5"/><text x="840" y="180" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Beispiel 1a) senkrecht auf g₁(x) = 2x − 4 im Ordinatendurchgang</text><text x="850" y="215" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">①  m₂ = −1 : 2 = −½</text><text x="850" y="245" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">②  x = 0:  g₁(0) = −4   →  P(0 | −4)</text><text x="850" y="275" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">③  P liegt auf der y-Achse  →  b = −4</text><text x="850" y="309" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2E8B57" text-anchor="start" xml:space="preserve">④  g₂(x) = −½x − 4</text><rect x="820" y="365" width="740" height="190" rx="14" fill="#F7DDE8" stroke="#333333" stroke-width="2.5"/><text x="840" y="400" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Beispiel 1b) senkrecht auf g₁ in der Nullstelle</text><text x="850" y="435" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">①  m₃ = −½      ②  0 = 2x − 4  →  x = 2  →  P(2 | 0)</text><text x="850" y="465" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">③  0 = −½ · 2 + b  →  0 = −1 + b  →  b = 1</text><text x="850" y="499" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2E8B57" text-anchor="start" xml:space="preserve">④  g₃(x) = −½x + 1</text><rect x="820" y="570" width="740" height="320" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><line x1="870" y1="585.0" x2="870" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="900" y1="585.0" x2="900" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="930" y1="585.0" x2="930" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="960" y1="585.0" x2="960" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="990" y1="585.0" x2="990" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="1020" y1="585.0" x2="1020" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="1050" y1="585.0" x2="1050" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="1080" y1="585.0" x2="1080" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="1110" y1="585.0" x2="1110" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="1140" y1="585.0" x2="1140" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="1170" y1="585.0" x2="1170" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="870" x2="1185.0" y2="870" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="840" x2="1185.0" y2="840" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="810" x2="1185.0" y2="810" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="780" x2="1185.0" y2="780" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="750" x2="1185.0" y2="750" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="720" x2="1185.0" y2="720" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="690" x2="1185.0" y2="690" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="660" x2="1185.0" y2="660" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="630" x2="1185.0" y2="630" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="600" x2="1185.0" y2="600" stroke="#E3E3E3" stroke-width="1"/><line x1="855.0" y1="690" x2="1185.0" y2="690" stroke="#333333" stroke-width="2"/><line x1="990" y1="582.0" x2="990" y2="870" stroke="#333333" stroke-width="2"/><text x="1181.0" y="682" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="end" xml:space="preserve">x</text><text x="998" y="598.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">y</text><text x="870" y="708" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="middle" xml:space="preserve">-4</text><text x="930" y="708" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="middle" xml:space="preserve">-2</text><text x="1050" y="708" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="middle" xml:space="preserve">2</text><text x="1110" y="708" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="middle" xml:space="preserve">4</text><text x="1170" y="708" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="middle" xml:space="preserve">6</text><text x="984" y="875" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="end" xml:space="preserve">-6</text><text x="984" y="815" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="end" xml:space="preserve">-4</text><text x="984" y="755" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="end" xml:space="preserve">-2</text><text x="984" y="635" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="end" xml:space="preserve">2</text><line x1="960" y1="870" x2="1102.5" y2="585.0" stroke="#333333" stroke-width="3"/><line x1="870" y1="750.0" x2="1110" y2="870.0" stroke="#D93A4A" stroke-width="3"/><line x1="855.0" y1="592.5" x2="1185.0" y2="757.5" stroke="#2F7FD6" stroke-width="3"/><circle cx="990" cy="810" r="6" fill="#D93A4A" stroke="none" stroke-width="0"/><circle cx="1050" cy="690" r="6" fill="#2F7FD6" stroke="none" stroke-width="0"/><text x="978" y="834" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#D93A4A" text-anchor="end" xml:space="preserve">P(0|−4)</text><text x="1060" y="680" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2F7FD6" text-anchor="start" xml:space="preserve">P(2|0)</text><text x="1350" y="615" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Skizze zu Aufgabe 1</text><line x1="1350" y1="650" x2="1382" y2="650" stroke="#333333" stroke-width="4"/><text x="1392" y="657" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">g₁(x) = 2x − 4</text><line x1="1350" y1="686" x2="1382" y2="686" stroke="#D93A4A" stroke-width="4"/><text x="1392" y="693" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">g₂(x) = −½x − 4</text><line x1="1350" y1="722" x2="1382" y2="722" stroke="#2F7FD6" stroke-width="4"/><text x="1392" y="729" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">g₃(x) = −½x + 1</text><text x="1350" y="780" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#555555" text-anchor="start" xml:space="preserve">g₂ und g₃ sind</text><text x="1350" y="802" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#555555" text-anchor="start" xml:space="preserve">parallel (m = −½),</text><text x="1350" y="824" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#555555" text-anchor="start" xml:space="preserve">beide stehen</text><text x="1350" y="846" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#555555" text-anchor="start" xml:space="preserve">senkrecht auf g₁.</text><rect x="40" y="905" width="1520" height="235" rx="14" fill="#FFF6E5" stroke="#D93A4A" stroke-width="3"/><text x="60" y="945" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Aufgabe 2 – Abstand paralleler Geraden:   g₁(x) = 2x + 1   und   g₂(x) = 2x + 4</text><text x="62" y="985" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#D93A4A" text-anchor="start" xml:space="preserve">Achtung: b₂ − b₁ = 3 ist nur der Abstand in y-Richtung – nicht der Abstand der Geraden!</text><text x="62" y="1017" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Der Abstand wird immer rechtwinklig gemessen (kürzester Weg):</text><text x="62" y="1049" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">①  Lot durch P(0 | 1) auf g₁:   m = −½   →   h(x) = −½x + 1</text><text x="62" y="1081" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">②  Schnitt mit g₂:   2x + 4 = −½x + 1  →  2,5x = −3  →  x = −1,2   →   S(−1,2 | 1,6)</text><text x="62" y="1113" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">③  Pythagoras:   d = √((−1,2)² + 0,6²) = √1,8 ≈ 1,34 LE</text><rect x="1200" y="985" width="340" height="135" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="1370" y="1020" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">Kurzformel</text><text x="1370" y="1058" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#222222" text-anchor="middle" xml:space="preserve">d = |b₂ − b₁| : √(1 + m²)</text><text x="1370" y="1098" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2E8B57" text-anchor="middle" xml:space="preserve">= 3 : √5 ≈ 1,34 LE</text></svg>