<svg xmlns="http://www.w3.org/2000/svg" xmlns:gn="http://www.goodnotes.com/gn-svg" width="1600" height="1060" viewBox="0 0 1600 1060"><circle cx="95" cy="68" r="28" fill="#6CD4E4" stroke="none" stroke-width="0"/><circle cx="129" cy="50" r="36" fill="#6CD4E4" stroke="none" stroke-width="0"/><circle cx="167" cy="64" r="30" fill="#6CD4E4" stroke="none" stroke-width="0"/><circle cx="193" cy="76" r="20" fill="#6CD4E4" stroke="none" stroke-width="0"/><rect x="75" y="68" width="130" height="28" rx="14" fill="#6CD4E4"/><polygon points="1500.0,38.0 1510.6,65.4 1539.9,67.0 1517.1,85.6 1524.7,114.0 1500.0,98.0 1475.3,114.0 1482.9,85.6 1460.1,67.0 1489.4,65.4" fill="#F6DD6B" stroke="#333333" stroke-width="3"/><text x="800" y="72" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">Unser Vorgehen: Funktionsgleichungen aufstellen</text><text x="800" y="112" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#555555" text-anchor="middle" xml:space="preserve">Strategie-Plakat von Team „Wolke“ für die Gruppe „Stern“</text><rect x="40" y="145" width="740" height="60" rx="14" fill="#FFF6E5" stroke="#333333" stroke-width="2.5"/><text x="60" y="185" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">So sind wir vorgegangen  (Ziel: y = m · x + b)</text><rect x="40" y="220" width="740" height="160" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><circle cx="78" cy="258" r="22" fill="#6CD4E4" stroke="#333333" stroke-width="2.5"/><text x="78" y="267" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">1</text><text x="115" y="268" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Steigung von g₁ ablesen</text><text x="62" y="306" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Die Zahl vor dem x ist die Steigung:  g₁(x) = 2x − 4  →  m = 2</text><text x="62" y="336" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Für „rechtwinklig“ haben wir die Regel m₁ · m₂ = −1 genutzt</text><text x="62" y="366" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">→ neue Steigung: m = −1 : 2 = −½</text><rect x="40" y="395" width="740" height="160" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><circle cx="78" cy="433" r="22" fill="#6CD4E4" stroke="#333333" stroke-width="2.5"/><text x="78" y="442" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">2</text><text x="115" y="443" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Einen passenden Punkt suchen</text><text x="62" y="481" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Durch welchen Punkt muss die neue Gerade gehen?</text><text x="62" y="511" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• Ordinatendurchgang: x = 0 einsetzen  →  (0 | −4)</text><text x="62" y="541" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• Nullstelle: g₁(x) = 0 setzen, nach x auflösen  →  (2 | 0)</text><rect x="40" y="570" width="740" height="130" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><circle cx="78" cy="608" r="22" fill="#6CD4E4" stroke="#333333" stroke-width="2.5"/><text x="78" y="617" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">3</text><text x="115" y="618" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">b ausrechnen</text><text x="62" y="656" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Punkt und Steigung in y = m · x + b einsetzen, nach b auflösen</text><text x="62" y="686" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Beim Ordinatendurchgang kann man b direkt ablesen</text><rect x="40" y="715" width="740" height="130" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><circle cx="78" cy="753" r="22" fill="#6CD4E4" stroke="#333333" stroke-width="2.5"/><text x="78" y="762" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve">4</text><text x="115" y="763" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Gleichung zusammensetzen</text><text x="62" y="801" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">m und b in y = m · x + b einsetzen</text><text x="62" y="831" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Aufgabe 2: y-Achsenabschnitte verglichen (b₂ − b₁)</text><rect x="820" y="145" width="740" height="390" rx="14" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/><text x="840" y="185" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Welche Strategien haben wir genutzt?</text><circle cx="855" cy="221" r="13" fill="#2E8B57" stroke="none" stroke-width="0"/><text x="855" y="227" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">✓</text><text x="880" y="228" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Steigung aus der Gleichung ablesen</text><circle cx="855" cy="257" r="13" fill="#2E8B57" stroke="none" stroke-width="0"/><text x="855" y="263" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">✓</text><text x="880" y="264" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Regel für senkrechte Geraden: m₁ · m₂ = −1</text><circle cx="855" cy="293" r="13" fill="#2E8B57" stroke="none" stroke-width="0"/><text x="855" y="299" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">✓</text><text x="880" y="300" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Besondere Punkte nutzen (y-Achse, Nullstelle)</text><circle cx="855" cy="329" r="13" fill="#2E8B57" stroke="none" stroke-width="0"/><text x="855" y="335" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">✓</text><text x="880" y="336" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Punkt einsetzen und nach b auflösen</text><text x="840" y="378" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#D93A4A" text-anchor="start" xml:space="preserve">Nicht genutzt – hätte aber geholfen:</text><circle cx="855" cy="409" r="13" fill="#D93A4A" stroke="none" stroke-width="0"/><text x="855" y="415" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">✗</text><text x="880" y="416" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Skizze zeichnen (vor allem bei Aufgabe 2)</text><circle cx="855" cy="445" r="13" fill="#D93A4A" stroke="none" stroke-width="0"/><text x="855" y="451" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">✗</text><text x="880" y="452" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Probe: Punkt in die fertige Gleichung einsetzen</text><circle cx="855" cy="481" r="13" fill="#D93A4A" stroke="none" stroke-width="0"/><text x="855" y="487" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">✗</text><text x="880" y="488" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">Überlegen, was „Abstand“ genau bedeutet</text><rect x="820" y="550" width="740" height="295" rx="14" fill="#F7DDE8" stroke="#333333" stroke-width="2.5"/><text x="840" y="590" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Unsere Stolperfallen</text><text x="840" y="630" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• Das x vergessen: wir hatten nur „(−½) − 4“ geschrieben.</text><text x="840" y="664" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">   Richtig ist g₂(x) = −½x − 4 → immer Form y = m · x + b prüfen!</text><text x="840" y="698" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">• Abstand: b₂ − b₁ = 3 ist nur der Abstand in y-Richtung.</text><text x="840" y="732" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">   Der Abstand zweier Geraden wird rechtwinklig gemessen:</text><text x="840" y="766" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">   Lot auf eine Gerade legen, mit der anderen schneiden,</text><text x="840" y="800" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">   dann Länge ausrechnen (Pythagoras).</text><rect x="40" y="865" width="1520" height="165" rx="14" fill="#FFF6E5" stroke="#333333" stroke-width="3"/><text x="60" y="905" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="start" xml:space="preserve">Unsere Tipps für euch</text><text x="62" y="945" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">1.  Erst überlegen: Welche Steigung? Durch welchen Punkt?  Dann rechnen.</text><text x="62" y="977" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">2.  Immer eine kleine Skizze machen – dann sieht man, ob das Ergebnis passen kann.</text><text x="62" y="1009" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">3.  Am Ende eine Probe machen und prüfen, ob die Gleichung wirklich die Form y = m · x + b hat.</text></svg>